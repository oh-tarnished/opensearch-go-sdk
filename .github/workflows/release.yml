name: release

# Pushing a tag vX.Y.Z publishes a GitHub release. The notes are the
# CHANGELOG.md section for that version followed by GitHub's generated list
# of merged pull requests; the pinned specification version is stated at the
# top. Tests run first, so a broken tag never becomes a release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  verify:
    name: generated code and tests
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check-generated
      - run: make vet
      - name: Unit and integration tests
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: go test -race -count=1 -timeout 15m ./...

  release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --notes-file "${RUNNER_TEMP}/notes.md"
          --generate-notes
          --verify-tag
      - name: Announce the version to the Go module proxy
        run: curl -fsS "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/${GITHUB_REF_NAME}.info"
